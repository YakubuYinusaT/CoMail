<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cohandle{% endblock %}</title>
<style>
  :root {
    --bg: #ffffff; --ink: #151515; --muted: #6b6b6b; --line: #e4e4e4;
    --red: #f50000; --soft: #fafafa; --good: #1a7f37; --warn: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414; --ink: #ededed; --muted: #9a9a9a; --line: #2c2c2c;
      --soft: #1c1c1c; --good: #3fb950; --warn: #d29922;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141414; --ink: #ededed; --muted: #9a9a9a; --line: #2c2c2c;
    --soft: #1c1c1c; --good: #3fb950; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; }
  header {
    border-bottom: 1px solid var(--line); padding: 14px 16px;
    display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap;
  }
  header .mark { font-weight: 650; letter-spacing: .02em; }
  header .mark span { color: var(--red); }
  header nav a { margin-right: 14px; text-decoration: none; color: var(--muted); }
  header nav a.on, header nav a:hover { color: var(--ink); }
  main { max-width: 1180px; margin: 0 auto; padding: 22px 16px 80px; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 26px 0 10px; text-transform: uppercase;
       letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase;
       letter-spacing: .06em; color: var(--muted); font-weight: 600;
       padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:hover td { background: var(--soft); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px;
          font-size: 12px; border: 1px solid var(--line); white-space: nowrap; }
  .pill.qualified { color: var(--good); border-color: currentColor; }
  .pill.needs_review, .pill.hold { color: var(--warn); border-color: currentColor; }
  .pill.rejected { color: var(--red); border-color: currentColor; }
  .pill.email { color: var(--good); border-color: currentColor; }
  .score { font-variant-numeric: tabular-nums; font-weight: 600; }
  .muted { color: var(--muted); }
  .warn { color: var(--warn); }
  .bad { color: var(--red); }
  .split { display: grid; grid-template-columns: 1.15fr .85fr; gap: 26px; }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
          margin-bottom: 14px; background: var(--soft); }
  .card h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase;
             letter-spacing: .06em; color: var(--muted); }
  .fact { border-left: 2px solid var(--line); padding: 2px 0 2px 10px;
          margin-bottom: 11px; font-size: 14px; }
  .fact.cited { border-left-color: var(--red); }
  .fact a { color: var(--muted); font-size: 12px; text-decoration: none;
            word-break: break-all; }
  .fact a:hover { color: var(--red); }
  textarea, input[type=text] {
    width: 100%; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 10px;
    font: inherit; }
  textarea { min-height: 330px; resize: vertical; line-height: 1.6; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
         margin-top: 12px; }
  button {
    font: inherit; padding: 7px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button:hover { border-color: var(--ink); }
  button.primary { background: var(--red); border-color: var(--red); color: #fff; }
  button.primary:hover { opacity: .9; }
  .advice { border-left: 3px solid var(--warn); padding: 9px 12px;
            background: var(--soft); border-radius: 0 6px 6px 0; margin-bottom: 14px; }
  .advice.ok { border-left-color: var(--good); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  code { background: var(--soft); padding: 1px 5px; border-radius: 4px;
         font-size: 13px; }
</style>
</head>
<body>
<header>
  <span class="mark">CO<span>HANDLE</span></span>
  <nav>
    <a href="/" class="{{ 'on' if nav == 'queue' }}">Review queue</a>
    <a href="/targets" class="{{ 'on' if nav == 'targets' }}">Targets</a>
    <a href="/apply" class="{{ 'on' if nav == 'apply' }}">Apply &amp; intro</a>
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
